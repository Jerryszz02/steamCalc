<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam 史低计算器</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="topbar">
    <h1>Steam 史低计算器</h1>
    <div class="topbar-controls">
      <label class="region-label">
        区域
        <select id="region-select"></select>
      </label>
      <button id="settings-btn" class="btn btn-ghost" type="button">API Key 设置</button>
    </div>
  </header>

  <main>
    <section class="search-section">
      <form id="search-form">
        <input id="search-input" type="text" placeholder="输入游戏名，如 Stardew Valley" autocomplete="off">
        <button class="btn btn-primary" type="submit">搜索</button>
      </form>
      <p id="source-hint" class="hint"></p>
    </section>

    <section id="search-results" class="results hidden"></section>

    <section id="detail" class="detail hidden"></section>

    <section class="wishlist-section">
      <div class="wishlist-header">
        <h2>本地愿望单</h2>
        <button id="refresh-wishlist" class="btn btn-ghost" type="button">刷新价格</button>
      </div>
      <div id="wishlist"></div>
    </section>
  </main>

  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h3>IsThereAnyDeal API Key</h3>
      <p class="hint">
        在 <a href="https://isthereanydeal.com/apps/my/" target="_blank" rel="noopener">isthereanydeal.com/apps/my</a>
        注册一个 App（免费）即可获得 key。key 只保存在你的浏览器 localStorage 中。
        不填 key 则使用 CheapShark 兜底（仅美元价格）。
      </p>
      <input id="api-key-input" type="text" placeholder="粘贴你的 ITAD API key">
      <div class="dialog-actions">
        <button id="clear-key-btn" class="btn btn-ghost" type="button">清除 key</button>
        <button class="btn btn-primary" value="ok">保存</button>
      </div>
    </form>
  </dialog>

  <footer>
    <p>
      价格数据来自 <a href="https://isthereanydeal.com" target="_blank" rel="noopener">IsThereAnyDeal</a>
      与 <a href="https://www.cheapshark.com" target="_blank" rel="noopener">CheapShark</a>，仅供参考。
    </p>
  </footer>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
